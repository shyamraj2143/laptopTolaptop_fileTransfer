name: Build and publish Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build GUI
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DirectDrop run.py

      - name: Build background agent
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DirectDropAgent agent_entry.py

      - name: Assemble installer payload
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force payload | Out-Null
          Copy-Item dist\DirectDrop.exe payload\DirectDrop.exe
          Copy-Item dist\DirectDropAgent.exe payload\DirectDropAgent.exe

      - name: Build setup EXE
        shell: powershell
        run: pyinstaller --noconfirm --clean --onefile --windowed --name DirectDrop-Setup --add-data "payload;payload" installer.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-Windows-Installer
          path: dist/DirectDrop-Setup.exe

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: DirectDrop v0.1.0
          body: DirectDrop Windows installer. Install on both laptops.
          make_latest: true
          files: dist/DirectDrop-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
