name: Build and publish Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Build GUI
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DirectDrop run.py

      - name: Build background agent
        shell: powershell
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name DirectDropAgent agent_entry.py

      - name: Install Inno Setup
        shell: powershell
        run: |
          choco install innosetup -y --no-progress

      - name: Build native Windows installer
        shell: powershell
        run: |
          & "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectDrop-Windows-Setup
          path: output/DirectDrop-Setup.exe

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: DirectDrop v0.2.0
          body: |
            DirectDrop Windows installer.
            
            Install DirectDrop on both laptops.
            Connect a supported USB4 / USB-network link and use DirectDrop for offline transfer.
          make_latest: true
          files: output/DirectDrop-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
