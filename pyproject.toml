[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directdrop"
version = "0.1.0"
description = "Zero-configuration offline laptop-to-laptop file transfer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.scripts]
directdrop = "run:main"
